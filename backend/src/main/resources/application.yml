spring:
  application:
    name: devops-copilot-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devops_copilot}
    username: ${DB_USERNAME:devops_user}
    password: ${DB_PASSWORD:devops_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET:ZGV2b3BzLWNvcGlsb3QtbGl0ZS1sb2NhbC1kZW1vLXNlY3JldC1rZXktMjAyNi1jaGFuZ2UtbWU=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-seconds: 5
    read-timeout-seconds: 60
